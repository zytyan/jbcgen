[project]
name = "annotation-parser"
version = "0.1.0"
description = "Generate C JSON decoders from C declarations and documentation annotations"
readme = "README.md"
authors = [
    { name = "zytyan", email = "58136520+zytyan@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
annotation-parser = "annotation_parser:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
required-version = "==0.16.2"
target-version = "py313"
